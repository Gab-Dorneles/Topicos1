# Configuração do datasource PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=skin_user
quarkus.datasource.password=1234
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5435/skin

quarkus.http.port=8081

# Desabilitar DevServices
quarkus.datasource.devservices.enabled=false

# Configurações do Hibernate ORM
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# Configurações de saudação
greeting.message=hello
greeting.name=quarkus